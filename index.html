<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple, editable monthly summary dashboard." />
  <title>Monthly Summary</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --paper: #ffffff;
      --canvas: #f5f3ef;
      --line: #e9e5df;
      --primary: #55725c;
      --primary-dark: #3f5b46;
      --shadow: 0 24px 70px rgba(44, 54, 43, .11);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--primary);
      content: "";
    }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; letter-spacing: -.055em; }
    .intro { max-width: 620px; margin: 16px 0 30px; color: var(--muted); font-size: 1.04rem; line-height: 1.6; }

    .summary {
      overflow: hidden;
      border: 1px solid rgba(221, 219, 211, .9);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 25px 32px;
      border-bottom: 1px solid var(--line);
    }
    .month-label { margin: 0; color: var(--muted); font-size: .82rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    #monthHeading { margin: 5px 0 0; font-size: clamp(1.55rem, 4vw, 2.15rem); letter-spacing: -.04em; }

    .month-nav { display: flex; gap: 8px; overflow-x: auto; margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); overscroll-behavior-x: contain; scrollbar-width: thin; }
    .month-nav button { flex: 0 0 auto; width: auto; min-height: 38px; padding: 0 12px; white-space: nowrap; }
    .month-nav button[aria-current="true"] { border-color: var(--primary); color: #fff; background: var(--primary); }
    .month-nav button[aria-current="true"]:hover { border-color: var(--primary-dark); background: var(--primary-dark); }

    .summary-body { display: grid; gap: 24px; padding: 32px; }
    .photo-gallery { display: grid; align-content: start; gap: 16px; width: 100%; min-width: 0; }
    .photo-gallery[hidden] { display: none; }
    .catalogue-image { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; overflow: hidden; margin: 0; border: 1px solid var(--line); border-radius: 16px; background: #f3f4f0; }
    .catalogue-image img { display: block; width: 100%; max-width: 100%; max-height: min(100vh, 720px); height: auto; object-fit: contain; }
    .catalogue-image figcaption { display: flex; flex-direction: column; justify-content: center; gap: 9px; min-width: 0; padding: 20px; border-left: 1px solid var(--line); color: var(--muted); background: #fbfaf8; font-size: .92rem; line-height: 1.6; }
    .catalogue-image figcaption p { margin: 0; }
    .month-content { min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: #fbfaf8; }
    .voice-notes { display: grid; gap: 16px; margin-bottom: 24px; }
    .voice-notes[hidden] { display: none; }
    .voice-note { display: grid; gap: 8px; }
    .voice-note p { margin: 0; color: var(--ink); font-size: .9rem; font-weight: 700; }
    .voice-note audio { display: block; width: 100%; }
    .lead { margin: 0 0 26px; color: #596456; font-size: 1.05rem; line-height: 1.75; }

    .footer { display: grid; gap: 14px; padding: 19px 32px; border-top: 1px solid var(--line); background: #fbfaf8; }
    .edit-note { margin: 0; color: var(--muted); font-size: .83rem; line-height: 1.4; }
    .controls { display: flex; justify-content: space-between; gap: 10px; }
    button { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 42px; padding: 0 15px; border: 1px solid #dce1ec; border-radius: 10px; color: var(--ink); background: var(--paper); cursor: pointer; font: inherit; font-size: .9rem; font-weight: 700; transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease; }
    button:hover { border-color: var(--primary); box-shadow: 0 5px 14px rgba(85, 114, 92, .16); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid rgba(85, 114, 92, .32); outline-offset: 2px; }
    button svg { width: 15px; height: 15px; }
    .next { border-color: var(--primary); color: #fff; background: var(--primary); }
    .next:hover { border-color: var(--primary-dark); background: var(--primary-dark); }
    .tracking-notice { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: flex; align-items: center; gap: 16px; width: min(660px, calc(100% - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: var(--shadow); }
    .tracking-notice[hidden] { display: none; }
    .tracking-notice h2 { margin: 0 0 4px; font-size: .95rem; }
    .tracking-notice p { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.45; }
    .tracking-actions { display: flex; flex: 0 0 auto; gap: 8px; }
    .tracking-actions button { width: auto; min-height: 38px; padding: 0 12px; }
    .fade-in { animation: appear .28s ease both; }
    @keyframes appear { from { opacity: .15; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 680px) {
      .page { width: min(100% - 20px, 1180px); padding: 28px 0; }
      .summary { border-radius: 19px; }
      .summary-head, .summary-body, .footer { padding: 22px; }
      .summary-body { gap: 20px; }
      .catalogue-image figcaption { gap: 6px; padding: 13px; font-size: .84rem; }
      .month-content { padding: 20px; }
      .footer { align-items: stretch; flex-direction: column; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; }
      button { width: 100%; padding: 0 8px; }
      .tracking-notice { right: 10px; bottom: 10px; left: 10px; flex-direction: column; align-items: stretch; width: auto; gap: 12px; }
      .tracking-actions { justify-content: flex-end; }
      .tracking-actions button { width: auto; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>

    </section>

    let currentMonth = 0;
    let thankyouUnlocked = false;
    const elements = {
      monthLabel: document.getElementById("monthLabel"),
      heading: document.getElementById("monthHeading"),
      overview: document.getElementById("overview"),
      content: document.getElementById("summaryContent"), gallery: document.getElementById("photoGallery"),
      voiceNotes: document.getElementById("voiceNotes"),
      monthNav: document.getElementById("monthNav")
    };
    let visitorIp;

    function renderMonthNav() {
      const visibleMonths = monthlyData
        .map((monthData, index) => ({ monthData, index }))
        .filter(({ monthData }) => monthData.month !== "Thankyou" || thankyouUnlocked);
      elements.monthNav.replaceChildren(...visibleMonths.map(({ monthData, index }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = monthData.month;
        button.setAttribute("aria-current", index === currentMonth ? "true" : "false");
        button.addEventListener("click", () => {
          currentMonth = index;
          renderMonth();
        });
        return button;
      }));
    }

    function renderImages(monthData) {
      const monthImages = catalogueImagesByMonth[monthData.month] ?? [];
      elements.gallery.replaceChildren(...monthImages.map(({ src, text }) => {
        const figure = document.createElement("figure");
        figure.className = "catalogue-image";
        const image = document.createElement("img");
        image.src = src;
        image.loading = "lazy";
        figure.append(image);
        const figcaption = document.createElement("figcaption");
        const description = document.createElement("p");
        description.textContent = text || monthData.overview || "Add a note for this photo here.";
        figcaption.append(description);
        figure.append(figcaption);
        return figure;
      }));
      if (monthImages.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "edit-note";
        emptyMessage.textContent = `Add images for ${monthData.month} in catalogueImagesByMonth.`;
        elements.gallery.append(emptyMessage);
      }
    }

    function renderMonth() {
      const data = monthlyData[currentMonth];
      if (data.month === "October 2026" && !thankyouUnlocked) {
        thankyouUnlocked = true;
        renderMonthNav();
      }
      elements.monthNav.querySelectorAll("button").forEach((button, index) => {
        button.setAttribute("aria-current", index === currentMonth ? "true" : "false");
      });
      const isThankyouPage = data.month === "Thankyou";
      elements.gallery.hidden = isThankyouPage;
      elements.voiceNotes.hidden = !isThankyouPage;
      if (isThankyouPage) {
        elements.gallery.replaceChildren();
      } else {
        renderImages(data);
      }
      elements.monthLabel.textContent = data.label;
      elements.heading.textContent = data.month;
      elements.overview.textContent = data.overview;
      elements.content.classList.remove("fade-in");
      void elements.content.offsetWidth; // restart the short transition
      elements.content.classList.add("fade-in");
      void logPageView(data.month);
    }

    async function logPageView(pageName, includeIp) {
      try {
        const visit = {
          pageName,
          timestamp: { ".sv": "timestamp" },
          timestampReadable: new Intl.DateTimeFormat("en-IN", {
            dateStyle: "medium",
            timeStyle: "medium",
            timeZone: "Asia/Kolkata"
          }).format(new Date())
        };
        if (includeIp && !visitorIp) {
          const ipResponse = await fetch("https://api.ipify.org?format=json");
          if (!ipResponse.ok) {
            throw new Error(`IP lookup failed with status ${ipResponse.status}.`);
          }
          const ipData = await ipResponse.json();
          if (typeof ipData.ip !== "string" || ipData.ip.length === 0) {
            throw new Error("IP lookup returned no IP address.");
          }
          visitorIp = ipData.ip;
        }
        if (includeIp) {
          visit.ipAddress = visitorIp;
        }

        const databaseResponse = await fetch("https://dost-52300-default-rtdb.asia-southeast1.firebasedatabase.app/pageVisits.json", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(visit)
        });
        if (!databaseResponse.ok) {
          throw new Error(`Firebase logging failed with status ${databaseResponse.status}.`);
        }
      } catch (error) {
        console.error("Could not save the page view to Firebase.", error);
      }
    }

    document.getElementById("previous").addEventListener("click", () => {
      currentMonth = (currentMonth - 1 + monthlyData.length) % monthlyData.length;
      renderMonth();
    });
    document.getElementById("next").addEventListener("click", () => {
      currentMonth = (currentMonth + 1) % monthlyData.length;
      renderMonth();
    });
    renderMonthNav();
    renderMonth();
  </script>
